services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billwise
      POSTGRES_PASSWORD: billwise
      POSTGRES_DB: billwise
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
      - ./tariffs:/app/tariffs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:
  uploads:
